name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libwine-dev mingw-w64-i686-dev
      - name: Build and package
        run: |
          make dist VERSION="${GITHUB_REF_NAME}"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS --verify-tag --generate-notes
